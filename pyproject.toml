[project]
name = "university-student-assistant"
version = "0.1.0"
description = "AI-powered university student assistant backend"
readme = "README.md"
requires-python = ">=3.11"

[project.dependencies]
fastapi = "0.111.1"
"uvicorn[standard]" = "0.24.0"
SQLAlchemy = "2.0.32"
"psycopg[binary]" = "3.1.20"
python-dotenv = "1.0.0"
"passlib[bcrypt]" = "1.7.4"
python-jose = "3.1.0"
pydantic = "1.10.12"
python-multipart = "0.0.7"
alembic = "1.11.1"
pgvector = "0.5.0"
openai = "1.7.0"
pdfplumber = "0.10.0"
python-docx = "1.2.0"
python-pptx = "0.6.21"
python-slugify = "8.0.1"
pytest = "8.3.5"
httpx = "0.27.0"
pytest-asyncio = "0.22.0"
python-magic = "0.4.27"
loguru = "0.7.0"
requests = "2.31.0"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
